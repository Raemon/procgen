services:
  - type: web
    name: procgen
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    numInstances: 1
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SERVER_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
